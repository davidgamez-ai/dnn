<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>XOR network: starting weights and biases (randomSeed 6)</title>
  <rect width="900" height="540" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="600" fill="#111827">XOR network: starting weights and biases</text>
  <text x="450" y="64" text-anchor="middle" font-size="14" fill="#4b5563">randomSeed 6, before any training</text>

  <!-- Layer headings -->
  <g font-size="15" font-weight="600" fill="#374151" text-anchor="middle">
    <text x="150" y="112">Input layer</text>
    <text x="450" y="112">Hidden layer (ReLU)</text>
    <text x="750" y="112">Output layer (softmax)</text>
  </g>

  <!-- Connections: blue = positive weight, red = negative; thickness shows size -->
  <g stroke-linecap="round">
    <!-- Input -> hidden -->
    <line x1="150" y1="180" x2="450" y2="180" stroke="#2563eb" stroke-width="4.7"/>
    <line x1="150" y1="360" x2="450" y2="180" stroke="#2563eb" stroke-width="2.3"/>
    <line x1="150" y1="180" x2="450" y2="360" stroke="#2563eb" stroke-width="4.4"/>
    <line x1="150" y1="360" x2="450" y2="360" stroke="#2563eb" stroke-width="1.3"/>
    <!-- Hidden -> output -->
    <line x1="450" y1="180" x2="750" y2="180" stroke="#2563eb" stroke-width="2.4"/>
    <line x1="450" y1="360" x2="750" y2="180" stroke="#dc2626" stroke-width="4.7"/>
    <line x1="450" y1="180" x2="750" y2="360" stroke="#2563eb" stroke-width="1.4"/>
    <line x1="450" y1="360" x2="750" y2="360" stroke="#2563eb" stroke-width="1.5"/>
  </g>

  <!-- Weight labels, placed 70% of the way along each connection so crossing lines stay readable -->
  <g font-size="13" font-weight="600" text-anchor="middle">
    <g fill="#ffffff" stroke="#d1d5db">
      <rect x="331" y="170" width="58" height="20" rx="4"/>
      <rect x="331" y="224" width="58" height="20" rx="4"/>
      <rect x="331" y="296" width="58" height="20" rx="4"/>
      <rect x="331" y="350" width="58" height="20" rx="4"/>
      <rect x="631" y="170" width="58" height="20" rx="4"/>
      <rect x="631" y="224" width="58" height="20" rx="4"/>
      <rect x="631" y="296" width="58" height="20" rx="4"/>
      <rect x="631" y="350" width="58" height="20" rx="4"/>
    </g>
    <text x="360" y="185" fill="#1d4ed8">1.221</text>
    <text x="360" y="239" fill="#1d4ed8">0.437</text>
    <text x="360" y="311" fill="#1d4ed8">1.128</text>
    <text x="360" y="365" fill="#1d4ed8">0.084</text>
    <text x="660" y="185" fill="#1d4ed8">0.466</text>
    <text x="660" y="239" fill="#b91c1c">-1.221</text>
    <text x="660" y="311" fill="#1d4ed8">0.143</text>
    <text x="660" y="365" fill="#1d4ed8">0.166</text>
  </g>

  <!-- Neurons -->
  <g stroke-width="2">
    <circle cx="150" cy="180" r="36" fill="#f3f4f6" stroke="#6b7280"/>
    <circle cx="150" cy="360" r="36" fill="#f3f4f6" stroke="#6b7280"/>
    <circle cx="450" cy="180" r="36" fill="#ecfdf5" stroke="#059669"/>
    <circle cx="450" cy="360" r="36" fill="#ecfdf5" stroke="#059669"/>
    <circle cx="750" cy="180" r="36" fill="#fef3c7" stroke="#d97706"/>
    <circle cx="750" cy="360" r="36" fill="#fef3c7" stroke="#d97706"/>
  </g>
  <g font-size="16" font-weight="600" fill="#111827" text-anchor="middle">
    <text x="150" y="186">input 0</text>
    <text x="150" y="366">input 1</text>
    <text x="450" y="186">hidden 0</text>
    <text x="450" y="366">hidden 1</text>
    <text x="750" y="186">output 0</text>
    <text x="750" y="366">output 1</text>
  </g>

  <!-- Biases -->
  <g font-size="13" fill="#374151" text-anchor="middle">
    <text x="450" y="236">bias 0.000</text>
    <text x="450" y="416">bias 0.000</text>
    <text x="750" y="236">bias 0.000</text>
    <text x="750" y="416">bias 0.000</text>
  </g>

  <!-- Meaning of each output -->
  <g font-size="13" fill="#4b5563">
    <text x="796" y="185">P(answer 0)</text>
    <text x="796" y="365">P(answer 1)</text>
  </g>

  <!-- Legend -->
  <g font-size="13" fill="#374151">
    <line x1="230" y1="490" x2="270" y2="490" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
    <text x="280" y="495">positive weight</text>
    <line x1="400" y1="490" x2="440" y2="490" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
    <text x="450" y="495">negative weight</text>
    <text x="580" y="495">line thickness = size of weight</text>
  </g>
</svg>
